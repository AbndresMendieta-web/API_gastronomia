services:
  mongo:
    image: mongo:7
    container_name: mongo_gastronomia_j
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bd_gastronomia_nosql
    volumes:
      - mongo_data:/data/db
      - ./database/01_mongo_init.js:/docker-entrypoint-initdb.d/01_mongo_init.js:ro

volumes:
  mongo_data: